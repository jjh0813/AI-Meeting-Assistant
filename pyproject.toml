[project]
name = "ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45.0.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "langgraph>=1.0.0,<2.0.0",
    "mcp>=1.27.0,<2.0.0",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
